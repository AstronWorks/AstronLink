# Astron Link client — loopback test config
listen_addr: "127.0.0.1:8443"
auth_token: "loopback-test-token"
name: "loopback-client"
insecure: true
log_level: "info"

# 클라이언트 PC에서 :3000을 띄워두고 (run-loopback.ps1이 알아서 띄움),
# 서버 :19000으로 들어온 외부 트래픽이 그곳으로 흐름.
tunnels:
  - type: tcp
    local_host: "127.0.0.1"
    local_port: 3000
    requested_port: 19000

  - type: http
    hostname: "test.local"
    local_host: "127.0.0.1"
    local_port: 3000

# 파일 전송 (드롭 폴더 + 우클릭/CLI). 배선 설명은 FILE_TRANSFER.md 참고.
file_transfer:
  enabled: false
  receive_addr: "127.0.0.1:8089"
  drop_dir: "received"
  token: "loopback-ft-token"
  send_endpoint: "http://127.0.0.1:8090"
  control_addr: "127.0.0.1:8077"
  max_file_size: 0

# VPN 모드 (가상 네트워크 어댑터) — docs/vpn.md 참고.
# 최초 핸드셰이크는 기존 네트워크로, 이후 트래픽은 어댑터(10.77.0.2)를 통해 흐른다.
# Windows: 관리자 권한 + wintun.dll, Linux: root/CAP_NET_ADMIN + iproute2 필요.
vpn:
  enabled: false
  routes: []      # 비우면 전체 터널. loopback(같은 호스트) 테스트는 분할 터널 권장: ["198.18.0.0/15"]
  bypass: []
