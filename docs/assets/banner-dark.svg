<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Astron Link</title>
  <desc id="d">Reverse-dial tunnel proxy for Go: the client listens, the server dials. Includes a VPN mode with a virtual network adapter.</desc>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- logo: client node (left) and server node (right); the server dials the client -->
  <g transform="translate(70,70)">
    <rect x="0" y="40" width="64" height="64" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="4"/>
    <rect x="132" y="40" width="64" height="64" rx="14" fill="#161b22" stroke="#4493f8" stroke-width="4"/>
    <path d="M132 58 C 110 20, 86 20, 66 58" fill="none" stroke="#4493f8" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 58 l 14 -4 M66 58 l 2 -14" fill="none" stroke="#4493f8" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 86 C 86 124, 110 124, 132 86" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
    <circle cx="32" cy="72" r="7" fill="#3fb950"/>
    <circle cx="164" cy="72" r="7" fill="#4493f8"/>
  </g>
  <text x="320" y="138" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#e6edf3">Astron Link</text>
  <text x="322" y="186" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#9198a1">Reverse-dial tunnel proxy with a VPN mode</text>
  <text x="322" y="232" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#8b949e">client listens · server dials · TLS 1.3 · TOFU pinning</text>
</svg>
