name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cmd: winclient
            goos: windows
            goarch: amd64
            cgo: "0"
            output: astronlink-client-windows-amd64.exe
            ldflags: "-H windowsgui -s -w"
          - cmd: winserver
            goos: windows
            goarch: amd64
            cgo: "0"
            output: astronlink-server-windows-amd64.exe
            ldflags: "-H windowsgui -s -w"
          - cmd: client
            goos: linux
            goarch: amd64
            cgo: "0"
            output: astronlink-client-linux-amd64
            ldflags: "-s -w"
          - cmd: client
            goos: linux
            goarch: arm64
            cgo: "0"
            output: astronlink-client-linux-arm64
            ldflags: "-s -w"
          - cmd: server
            goos: linux
            goarch: amd64
            cgo: "0"
            output: astronlink-server-linux-amd64
            ldflags: "-s -w"
          - cmd: server
            goos: linux
            goarch: arm64
            cgo: "0"
            output: astronlink-server-linux-arm64
            ldflags: "-s -w"
          - cmd: server
            goos: windows
            goarch: amd64
            cgo: "0"
            output: astronlink-server-cli-windows-amd64.exe
            ldflags: "-s -w"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath -ldflags "${{ matrix.ldflags }} -X main.Version=${GITHUB_REF_NAME} -X main.Commit=${GITHUB_SHA::7} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ${{ matrix.output }} ./cmd/${{ matrix.cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            astronlink-client-windows-amd64.exe
            astronlink-server-windows-amd64.exe
            astronlink-client-linux-amd64
            astronlink-client-linux-arm64
            astronlink-server-linux-amd64
            astronlink-server-linux-arm64
            astronlink-server-cli-windows-amd64.exe
          generate_release_notes: true
